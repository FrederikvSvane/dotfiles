# kitty config: Catppuccin Mocha, matches the tmux/nvim setup in this repo.
# macOS-oriented (cmd keybindings, macos_* options); installed by setup.sh only
# where kitty exists. Reload with cmd+shift+r.

# ── Fonts ────────────────────────────────────────────────
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

# ── Cursor ───────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval -1
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ───────────────────────────────────────────
# iTerm had 1000; bumped for tmux-less use
scrollback_lines 10000

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait      3.0
copy_on_select       clipboard
strip_trailing_spaces smart
url_style            curly
detect_urls          yes

# ── Window ───────────────────────────────────────────────
initial_window_width  80c
initial_window_height 25c
remember_window_size  no
window_padding_width  8
hide_window_decorations no
confirm_os_window_close 0
enabled_layouts       splits,stack
# iTerm: split pane dimming ~0.4
inactive_text_alpha   0.6
window_border_width   1pt
draw_minimal_borders  yes

# ── Tab bar ──────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_title_template    "{index}: {title}"
active_tab_font_style bold
# iTerm: HideTab (hidden with a single tab)
tab_bar_min_tabs      2

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell no
# subtle bell: a short, dim flash instead of kitty's default full-brightness one
visual_bell_duration 0.12 ease-in-out
visual_bell_color    #45475A

# ── macOS ────────────────────────────────────────────────
macos_option_as_alt        left
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# ── Terminal type ────────────────────────────────────────
# xterm-256color instead of xterm-kitty: ssh hosts without kitty's terminfo
# keep working, and tmux.conf's true-colour override matches it.
term xterm-256color

# ── Shell integration ────────────────────────────────────
shell_integration enabled no-cursor
update_check_interval 0
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# ── Keybindings ──────────────────────────────────────────
# Splits
map cmd+d        launch --location=vsplit --cwd=current
map cmd+shift+d  launch --location=hsplit --cwd=current
map cmd+t        new_tab_with_cwd
map cmd+alt+i            launch --location=vsplit --cwd=current
map cmd+alt+minus        launch --location=hsplit --cwd=current
map cmd+enter    toggle_layout stack
map cmd+w        close_window

# Navigate splits
# cmd+opt+arrows: tmux panes when the window runs tmux/ssh/mosh, kitty splits
# otherwise (decided in arrow_pass.py, which checks the foreground process)
map cmd+alt+left  kitten arrow_pass.py left
map cmd+alt+right kitten arrow_pass.py right
map cmd+alt+up    kitten arrow_pass.py up
map cmd+alt+down  kitten arrow_pass.py down

# Jump to tab by number
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Delete the whole line (sends ctrl+u)
map cmd+backspace send_text all \x15

# Font size
map cmd+plus     change_font_size all +1.0
map cmd+minus    change_font_size all -1.0
map cmd+0        change_font_size all 0

# Reload config
map cmd+shift+r  load_config_file

