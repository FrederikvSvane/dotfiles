# tmux config: mouse/trackpad scrolling, sane defaults, Catppuccin mocha colours.
# Written to work on old (2.x) and new (3.x) tmux, with no plugins or TPM needed.

# --- general ------------------------------------------------------------------
set -g mouse on                     # trackpad scroll, click to focus, drag to resize/select
set -g history-limit 50000
set -g base-index 1                 # windows and panes start at 1 (matches the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10               # no laggy Esc (matters in nvim)
set -g focus-events on              # lets nvim notice focus changes (autoread)
set -g display-time 2000
set -g repeat-time 600
set -g set-clipboard on             # copy to the system clipboard via OSC 52 (works over ssh)
setw -g automatic-rename on

# true colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# --- keys ---------------------------------------------------------------------
# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# splits keep the current directory; | and - are easier to remember than " and %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# move between panes: prefix + hjkl, or Alt + arrows with no prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# resize panes: prefix + Shift-hjkl (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# windows: Shift + arrows with no prefix; prefix + </> to reorder
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# --- copy mode (vi keys; mouse selection also works) --------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
# releasing the mouse after a drag copies the selection and stays in copy mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# --- look: Catppuccin mocha ---------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8]#h #[bg=#313244,fg=#cdd6f4] %a %d %b  %H:%M "
setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#f5c2e7,bold] #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#f5c2e7"
set -g mode-style "bg=#45475a,fg=#f5e0dc"
